<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alliance Roster Showcase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #160b2e 0%, #3c1650 34%, #8e2f56 62%, #e2603f 82%, #ff9a3d 100%);
    color: #fff; overflow-x: hidden; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  header { text-align: center; padding: 26px 16px 6px; z-index: 2; }
  header h1 { font-size: clamp(26px, 5vw, 52px); letter-spacing: 4px; font-weight: 800; text-shadow: 0 3px 18px rgba(0,0,0,.55); }
  header p { opacity: .85; letter-spacing: 2px; margin-top: 6px; font-size: clamp(11px, 2vw, 16px); }
  .stage {
    flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
    perspective: 1900px; perspective-origin: 50% 46%; min-height: 600px;
  }
  .deck { position: relative; width: 190px; height: 330px; }
  .card {
    position: absolute; inset: 0; will-change: transform;
    background: linear-gradient(180deg, #241839, #120a24);
    border: 2px solid rgba(255, 170, 80, .55);
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 14px 34px rgba(0,0,0,.5);
    display: flex; flex-direction: column;
  }
  .card.active {
    border-color: #ffd27a;
    box-shadow: 0 0 0 3px rgba(255,210,122,.65), 0 18px 44px rgba(0,0,0,.6);
  }
  .card img {
    display: block; width: 100%; height: 282px; object-fit: contain;
    background: radial-gradient(ellipse at 50% 88%, rgba(255,140,60,.28), rgba(0,0,0,0) 62%);
  }
  .card figcaption {
    height: 48px; display: flex; align-items: center; justify-content: center;
    font-weight: 700; letter-spacing: 1px; font-size: 17px; text-align: center;
    background: rgba(0,0,0,.38); padding: 0 6px;
  }
  .glow {
    position: fixed; left: 50%; bottom: 4%; transform: translateX(-50%);
    width: min(88vw, 1050px); height: 120px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,120,40,.35), rgba(255,120,40,0) 70%);
    pointer-events: none;
  }
  .directory { width: min(1060px, 94vw); margin: 4px auto 8px; z-index: 2; }
  .directory h2 { text-align: center; font-size: 15px; letter-spacing: 3px; font-weight: 700; opacity: .9; margin-bottom: 12px; }
  .dir-controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .dir-controls input {
    background: rgba(0,0,0,.4); color: #fff; border: 1px solid rgba(255,170,80,.55);
    border-radius: 999px; padding: 10px 16px; font-size: 15px; min-width: min(280px, 78vw);
    outline: none;
  }
  .dir-controls input::placeholder { color: rgba(255,255,255,.55); }
  .dir-controls input:focus { border-color: #ffd27a; }
  #resumeBtn {
    background: rgba(255,154,61,.9); color: #1c0f2e; border: none; border-radius: 999px;
    padding: 10px 18px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .member-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .member-list button {
    background: rgba(0,0,0,.35); color: #fff; border: 1px solid rgba(255,170,80,.45);
    border-radius: 999px; padding: 7px 13px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .member-list button:hover { border-color: #ffd27a; }
  .member-list button.active { background: rgba(255,154,61,.9); color: #1c0f2e; font-weight: 700; border-color: transparent; }
  .no-match { text-align: center; opacity: .85; padding: 8px 0 2px; }
  footer { padding: 10px 16px 20px; opacity: .75; font-size: 13px; letter-spacing: 1px; z-index: 2; text-align: center; }
  .hint-swipe { display: none; }
  @media (max-width: 760px) {
    .stage { perspective: 1000px; perspective-origin: 50% 50%; min-height: 520px; touch-action: pan-y; }
    .glow { display: none; }
    .hint-hover { display: none; }
    .hint-swipe { display: inline; }
  }
</style>

<script>
(function () {
  var deck = document.querySelector('.deck');
  var stage = document.querySelector('.stage');
  var cards = Array.prototype.slice.call(deck.children);
  var total = cards.length;
  var step = 360 / total;
  var speed = 360 / 110; // degrees per second
  var current = 0;
  var mode = 'spin'; // 'spin' | 'focus' | 'hold'
  var focusTarget = 0;
  var holdPause = false;
  var resumeTimer = null;
  var resumeBtn = document.getElementById('resumeBtn');
  var list = document.getElementById('memberList');
  var search = document.getElementById('memberSearch');
  var noMatch = document.getElementById('noMatch');
  var activeBtn = null, activeCard = null;
  var lastZ = new Array(total).fill(null);

  function radius() {
    var w = window.innerWidth;
    if (w <= 760) return 290;
    if (w <= 1200) return 700;
    return 860;
  }

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    mode = 'hold';
  }

  function norm(a) { a = a % 360; if (a > 180) a -= 360; if (a < -180) a += 360; return a; }

  function render() {
    var r = radius();
    for (var i = 0; i < total; i++) {
      var ang = current + i * step;
      cards[i].style.transform = 'rotateY(' + ang + 'deg) translateZ(' + r + 'px)';
      var z = 1000 + Math.round(Math.cos(ang * Math.PI / 180) * 1000);
      if (lastZ[i] !== z) { cards[i].style.zIndex = z; lastZ[i] = z; }
    }
  }

  function setActive(i, btn) {
    if (activeCard) activeCard.classList.remove('active');
    if (activeBtn) activeBtn.classList.remove('active');
    activeCard = cards[i]; activeCard.classList.add('active');
    activeBtn = btn || null;
    if (activeBtn) activeBtn.classList.add('active');
  }

  function goTo(i, btn) {
    var targetMod = norm(-i * step);
    focusTarget = current + norm(targetMod - norm(current));
    mode = 'focus';
    setActive(i, btn);
    resumeBtn.hidden = false;
    clearTimeout(resumeTimer);
    resumeTimer = setTimeout(resume, 25000);
  }

  function resume() {
    clearTimeout(resumeTimer);
    mode = 'spin';
    if (activeCard) activeCard.classList.remove('active');
    if (activeBtn) activeBtn.classList.remove('active');
    activeCard = null; activeBtn = null;
    resumeBtn.hidden = true;
  }

  var last = null;
  function tick(ts) {
    if (last === null) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000); last = ts;
    if (!holdPause) {
      if (mode === 'spin') {
        current -= speed * dt;
      } else if (mode === 'focus') {
        var delta = focusTarget - current;
        current += delta * Math.min(1, dt * 2.4);
        if (Math.abs(delta) < 0.05) current = focusTarget;
      }
    }
    render();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  stage.addEventListener('mouseenter', function () { holdPause = true; });
  stage.addEventListener('mouseleave', function () { holdPause = false; });
  stage.addEventListener('touchstart', function () { holdPause = true; }, { passive: true });
  stage.addEventListener('touchend', function () { setTimeout(function () { holdPause = false; }, 600); }, { passive: true });

  list.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-i]');
    if (btn) goTo(parseInt(btn.getAttribute('data-i'), 10), btn);
  });
  resumeBtn.addEventListener('click', resume);

  function applyFilter() {
    var q = search.value.trim().toLowerCase();
    var visible = 0, first = null;
    var btns = list.querySelectorAll('button[data-i]');
    btns.forEach(function (b) {
      var hit = !q || b.getAttribute('data-search').indexOf(q) !== -1;
      b.style.display = hit ? '' : 'none';
      if (hit) { visible++; if (!first) first = b; }
    });
    noMatch.hidden = visible !== 0;
    return first;
  }
  search.addEventListener('input', applyFilter);
  search.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var first = applyFilter();
      if (first) first.click();
    }
  });
})();
</script>
