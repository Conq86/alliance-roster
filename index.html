<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alliance Roster Showcase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #160b2e 0%, #3c1650 34%, #8e2f56 62%, #e2603f 82%, #ff9a3d 100%);
    color: #fff; overflow-x: hidden; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  header { text-align: center; padding: 26px 16px 6px; z-index: 2; }
  header h1 { font-size: clamp(26px, 5vw, 52px); letter-spacing: 4px; font-weight: 800; text-shadow: 0 3px 18px rgba(0,0,0,.55); }
  header p { opacity: .85; letter-spacing: 2px; margin-top: 6px; font-size: clamp(11px, 2vw, 16px); }
  .stage {
    flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
    perspective: 1900px; perspective-origin: 50% 46%; min-height: 600px;
  }
  .ring {
    position: relative; width: 190px; height: 330px;
    transform-style: preserve-3d; animation: spin 110s linear infinite;
    --r: 860px;
  }
  .stage:hover .ring { animation-play-state: paused; }
  @keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(-360deg); } }
  .card {
    position: absolute; inset: 0;
    transform: rotateY(var(--a)) translateZ(var(--r));
    background: linear-gradient(180deg, #241839, #120a24);
    border: 2px solid rgba(255, 170, 80, .55);
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 14px 34px rgba(0,0,0,.5);
    display: flex; flex-direction: column;
  }
  .card img {
    display: block; width: 100%; height: 282px; object-fit: contain;
    background: radial-gradient(ellipse at 50% 88%, rgba(255,140,60,.28), rgba(0,0,0,0) 62%);
  }
  .card figcaption {
    height: 48px; display: flex; align-items: center; justify-content: center;
    font-weight: 700; letter-spacing: 1px; font-size: 17px; text-align: center;
    background: rgba(0,0,0,.38); padding: 0 6px;
  }
  .glow {
    position: fixed; left: 50%; bottom: 4%; transform: translateX(-50%);
    width: min(88vw, 1050px); height: 120px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,120,40,.35), rgba(255,120,40,0) 70%);
    pointer-events: none;
  }
  footer { padding: 10px 16px 20px; opacity: .75; font-size: 13px; letter-spacing: 1px; z-index: 2; text-align: center; }
  .hint-swipe { display: none; }
  @media (max-width: 1200px) and (min-width: 761px) { .ring { --r: 700px; } }
  @media (max-width: 760px) {
    .stage { perspective: none; display: block; min-height: 0; padding: 8px 0 4px; }
    .ring {
      position: relative; width: 100%; height: auto; --r: 0px;
      transform: none; animation: none; transform-style: flat;
      display: flex; flex-direction: row; overflow-x: auto;
      scroll-snap-type: x mandatory; gap: 14px; padding: 8px 13vw 18px;
      -webkit-overflow-scrolling: touch;
    }
    .card {
      position: relative; inset: auto; transform: none;
      flex: 0 0 74vw; max-width: 330px; height: 68vh; max-height: 540px;
      scroll-snap-align: center;
    }
    .card img { flex: 1 1 auto; height: auto; min-height: 0; }
    .card figcaption { height: 52px; font-size: 18px; flex: 0 0 auto; }
    .hint-hover { display: none; }
    .hint-swipe { display: inline; }
    .glow { display: none; }
  }
</style>
